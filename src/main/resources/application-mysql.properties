# MySQL profile. Activate with: --spring.profiles.active=mysql
#
# Create the schema first:
#   CREATE DATABASE portfolio_tracker CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# Supply credentials on the command line rather than committing them:
#   ./gradlew bootRun --args='--spring.profiles.active=mysql \
#       --spring.datasource.username=root --spring.datasource.password=YOUR_PASSWORD'

spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_tracker?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
