spring.application.name=portfolio-tracker-backend
server.port=8080

# --- Database -------------------------------------------------------------
# H2 file-based by default so the project runs with zero setup.
# To use MySQL instead, run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/portfolio;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- External APIs --------------------------------------------------------
app.external.coingecko.base-url=https://api.coingecko.com/api/v3
app.external.coingecko.timeout-seconds=15
app.external.nbp.base-url=https://api.nbp.pl/api
app.external.nbp.timeout-seconds=15

# --- Scheduler ------------------------------------------------------------
# One job refreshes CoinGecko prices and NBP rates together every 15 minutes,
# then re-evaluates alerts. The first run waits for startup to settle.
app.scheduler.enabled=true
app.scheduler.market-refresh-ms=900000
app.scheduler.initial-delay-ms=15000
# A second job trims price history nightly at 03:00 to the retention window.
app.scheduler.purge-cron=0 0 3 * * *
app.scheduler.price-retention-days=90

# --- Alerts ---------------------------------------------------------------
# Minimum gap before an alert whose condition is still true fires again.
app.alerts.cooldown-minutes=60

# --- Demo data ------------------------------------------------------------
# Seeds a demo user, portfolios and transactions into an empty database.
app.seed-demo-data=true

# --- CORS -----------------------------------------------------------------
# The Vaadin frontend runs as a separate application on port 8081.
app.cors.allowed-origins=http://localhost:8081

logging.level.com.kodilla.portfolio=INFO
