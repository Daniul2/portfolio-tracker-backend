# Test profile: in-memory database, no scheduler, no network, no demo data.
spring.datasource.url=jdbc:h2:mem:portfolio-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.scheduler.enabled=false
app.scheduler.price-refresh-ms=900000
app.scheduler.rate-refresh-ms=3600000
app.seed-demo-data=false

app.external.coingecko.base-url=http://localhost:9999
app.external.coingecko.timeout-seconds=2
app.external.nbp.base-url=http://localhost:9999
app.external.nbp.timeout-seconds=2

app.cors.allowed-origins=http://localhost:8081
app.alerts.cooldown-minutes=60
